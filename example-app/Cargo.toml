[package]
name = "example-app"
version = "0.1.0"
edition = "2024"

[dependencies]
leptos = { version = "0.7", features = ["csr"] }
leptos_router = "0.7"
leptos_meta = "0.7"
console_error_panic_hook = "0.1"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Document", "Element", "HtmlElement", "Window"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `wasmbind` is required, not optional, on wasm32-unknown-unknown: without
# it, `chrono::Utc::now()` calls `std::time::SystemTime::now()`, which
# panics at runtime in a browser ("time not implemented on this platform")
# rather than failing to compile -- this feature routes the clock read
# through `wasm-bindgen`'s `Date.now()` binding instead.
chrono = { version = "0.4", features = ["wasmbind"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
